name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'          # weekly: longer fuzz run and a fresh pip-audit

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install (ranges from pyproject.toml)
        run: python -m pip install -e ".[gui,ips,dev]"
      - name: Lint
        run: python -m pyflakes netsentinel tests tools idps.py
      - name: Tests
        run: python -m pytest -q
      - name: Longer fuzz run (weekly)
        if: github.event_name == 'schedule'
        env:
          NETSENTINEL_FUZZ_CASES: '20000'
          NETSENTINEL_FUZZ_SEED: ${{ github.run_id }}
        run: python -m pytest -q tests/test_fuzz.py

  locked:
    # The exact, hash-checked versions from requirements-lock.txt, plus a vulnerability audit.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install locked versions
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip install "pytest>=7,<10" "pip-audit>=2.7,<3"
      - name: Tests
        run: python -m pytest -q
      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements-lock.txt --require-hashes
