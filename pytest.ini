[pytest]
testpaths = tests
# Import netsentinel from the project folder without installing it.
pythonpath = .
addopts = -q -ra --strict-markers
markers =
    gui: needs PyQt6 (runs with Qt's offscreen platform)
    needs_scapy: needs scapy
    needs_root: needs administrator/root rights and is skipped otherwise
    network: reaches the internet
